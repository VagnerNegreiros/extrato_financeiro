include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Missing docs on every public member is noise for an app (not a library).
    public_member_api_docs: ignore
    # Android/iOS only: ints are 64-bit, which money in cents relies on.
    avoid_js_rounded_ints: ignore

linter:
  rules:
    # Monetary and time rules are enforced by tests and review; these keep
    # code style consistent with the team conventions in AI_INSTRUCTIONS.
    avoid_print: true
    prefer_final_locals: true
    require_trailing_commas: true
