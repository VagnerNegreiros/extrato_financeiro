name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  quality:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Tests with coverage
        run: flutter test --coverage

      # Fails the build below 70% on domain + view models.
      - name: Coverage gate
        run: dart run tool/coverage.dart --min=70

      - name: Coverage HTML report
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          genhtml coverage/lcov_gate.info -o coverage/html --quiet

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/lcov_gate.info
            coverage/html

  integration-test:
    name: Integration test (Android emulator)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Run integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: flutter test integration_test --dart-define-from-file=config/env.example.json

  build-android:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      # With the COINGECKO_API_KEY secret the APK uses the live API (prod);
      # without it (forks, first runs) it falls back to the offline dev data.
      - name: Prepare build configuration
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          if [ -n "$COINGECKO_API_KEY" ]; then
            printf '{"APP_FLAVOR":"prod","COINGECKO_BASE_URL":"https://api.coingecko.com/api/v3","COINGECKO_API_KEY":"%s","FAKE_FAILURE":"none"}' "$COINGECKO_API_KEY" > config/ci.json
          else
            cp config/env.example.json config/ci.json
          fi

      - name: Build obfuscated release APK
        run: >
          flutter build apk --release
          --obfuscate
          --split-debug-info=build/symbols
          --extra-gen-snapshot-options=--strip
          --dart-define-from-file=config/ci.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols

      # Tags (v1.0.0) publish the APK as a GitHub Release for QA/evaluators.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
